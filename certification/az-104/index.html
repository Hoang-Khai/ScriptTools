<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ-104 Exam Study Platform</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Google Fonts: Antic Slab -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Antic+Slab&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (free) for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- ========================== VIEW A: CHAPTER SELECTION ========================== -->
    <div id="view-chapters" class="view-container active">
        <div class="container py-5">
            <div class="text-center mb-5">
                <h1 class="display-4 fw-bold" style="color: #A47251;">
                    <i class="fas fa-cloud me-3"></i>AZ-104 Study Platform
                </h1>
                <p class="lead text-muted">Microsoft Certified Azure Administrator Associate · Exam AZ-104</p>
                <hr class="mx-auto" style="width: 120px; border-color: #DD9E59; border-width: 3px;" />
            </div>

            <div class="row g-4" id="chapter-grid">
                <!-- Cards will be injected by JavaScript -->
            </div>
        </div>
    </div>

    <!-- ========================== VIEW B: SPLIT-SCREEN VIEWPORT ========================== -->
    <div id="view-split" class="view-container">
        <!-- Fixed Header -->
        <header id="split-header" class="d-flex align-items-center justify-content-between px-4 py-2 shadow-sm">
            <div class="d-flex align-items-center gap-3">
                <button id="btn-back" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="fas fa-arrow-left me-1"></i> Back to Chapters
                </button>
                <div id="header-meta" class="d-flex align-items-center gap-3 flex-wrap">
                    <span class="badge bg-primary-accent fs-6">Ch. <span id="meta-chapter">—</span></span>
                    <span id="meta-title" class="fw-semibold fs-5" style="color: #1A1A1A;">—</span>
                    <span class="text-muted small">|</span>
                    <span class="text-muted small" id="meta-source">—</span>
                    <span class="text-muted small" id="meta-version">—</span>
                </div>
            </div>
            <div id="header-score" class="text-muted small">
                <i class="fas fa-check-circle text-success me-1"></i>
                <span id="score-display">0 / 0</span>
            </div>
        </header>

        <!-- Split Viewport -->
        <div id="split-body" class="d-flex">
            <!-- LEFT COLUMN: Knowledge Base -->
            <div id="col-knowledge" class="split-col col-knowledge p-4 overflow-auto">
                <h5 class="section-title"><i class="fas fa-book-open me-2"></i>Knowledge Base</h5>
                <div id="knowledge-content">
                    <!-- Injected by JavaScript -->
                </div>
            </div>

            <!-- RIGHT COLUMN: Quiz Engine -->
            <div id="col-quiz" class="split-col col-quiz p-4 overflow-auto">
                <h5 class="section-title"><i class="fas fa-puzzle-piece me-2"></i>Quiz Engine</h5>
                <div id="quiz-content">
                    <!-- Injected by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
    <!-- Custom Application Script -->
    <script src="app.js"></script>
</body>
</html>
